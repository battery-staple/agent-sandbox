allowed_workspaces: []

# Host directories outside the whitelisted workspaces from which JSON skill
# catalogs (skills.json) may bind-mount skills read-only. Empty means deny:
# catalog entries pointing outside a workspace are ignored. These paths are
# read from the host-only whitelist, never from agent-writable content.
allowed_skill_roots: []

allowed_commands:
  xcodebuild:
    binary_path: /usr/bin/xcodebuild
    allowed_args_regex: ^(-version|-showsdks|-list.*)$
    require_interactive_approval: false
    description: Apple Xcode build system and SDK inspection
  open:
    binary_path: /usr/bin/open
    allowed_args_regex: ^(-a Simulator|https?://.*)$
    require_interactive_approval: false
    description: Open URLs or macOS applications (e.g. Simulator)
  git-credential-osxkeychain:
    binary_path: /usr/bin/git
    allowed_args_regex: ^credential-osxkeychain (get|store|erase)$
    require_interactive_approval: true
    description: macOS Keychain Git credential helper
  sw_vers:
    binary_path: /usr/bin/sw_vers
    allowed_args_regex: ^.*$
    require_interactive_approval: false
    description: macOS system version information
  chrome:
    binary_path: /Applications/Google Chrome.app/Contents/MacOS/Google Chrome
    allowed_args_regex: ^(--remote-debugging-port=\d+.*|--version.*)$
    require_interactive_approval: false
    description: Google Chrome with remote debugging on macOS host
