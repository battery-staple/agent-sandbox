name: agent-sandbox

# Engine services are NOT declared here. They are generated at runtime by
# `bin/agent-sandbox` into ~/.agent-sandbox/docker-compose.override.yml from:
#   - engines/<name>/manifest.yaml       (per-engine: port, mounts, skills, rules)
#   - config/compose.common.yaml         (engine-agnostic defaults, merged into every service)
# This file intentionally contains zero engine-specific content.

services: {}
volumes: {}
