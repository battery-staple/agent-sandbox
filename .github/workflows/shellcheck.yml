name: ShellCheck

on:
  push:
    branches: [main]
  pull_request:

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      # Collect every tracked *.sh file, plus extensionless scripts whose
      # shebang targets a POSIX shell. guest/bin also contains Python
      # wrappers (host-exec, google-chrome, chrome-devtools-mcp), which
      # ShellCheck does not understand, so the shebang check keeps them out.
      - name: Discover shell scripts
        id: scripts
        run: |
          scripts=()
          while IFS= read -r file; do
            case "$file" in
              *.sh)
                scripts+=("$file")
                ;;
              *)
                if head -n 1 "$file" | grep -qE '^#!.*(bash|/sh)\b'; then
                  scripts+=("$file")
                fi
                ;;
            esac
          done < <(git ls-files)
          printf 'count=%s\n' "${#scripts[@]}" >> "$GITHUB_OUTPUT"
          printf '%s\n' "${scripts[@]}" | tee /tmp/scripts.txt

      - name: Run ShellCheck
        run: shellcheck --severity=info $(cat /tmp/scripts.txt)
